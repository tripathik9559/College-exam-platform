<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Identity Verification – BBDNIIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
    #video-box { border: 3px solid #ef4444; border-radius: 1rem; overflow: hidden; background: #0f172a; }
    #video-box.ready { border-color: #22c55e; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">

  <!-- Header -->
  <div class="bg-blue-600 -mx-8 -mt-8 px-8 py-5 rounded-t-2xl mb-6">
    <h1 class="text-white text-2xl font-bold flex items-center gap-2">🔒 Identity Verification</h1>
    <p class="text-blue-100 text-sm mt-1">Please allow camera access so we can verify your identity before proceeding.</p>
  </div>

  <p class="text-center text-gray-600 mb-4 text-sm">Look directly at the camera and click <strong>Capture Photo</strong>.</p>

  <!-- Camera -->
  <div id="video-box" class="relative mx-auto mb-3" style="width:100%;aspect-ratio:4/3;">
    <video id="cam" autoplay muted playsinline class="w-full h-full object-cover"></video>
    <canvas id="cnv" class="hidden"></canvas>
    <div id="captured-preview" class="hidden absolute inset-0">
      <img id="captured-img" class="w-full h-full object-cover" alt="Captured face"/>
      <div class="absolute inset-0 bg-green-500/20 flex items-center justify-center">
        <span class="bg-green-500 text-white text-lg font-bold px-4 py-2 rounded-full">✓ Captured!</span>
      </div>
    </div>
  </div>

  <!-- Status -->
  <p id="status-msg" class="text-center text-amber-500 text-sm mb-4 flex items-center justify-center gap-2">
    ⏳ Requesting camera access...
  </p>

  <!-- Hidden form -->
  <form id="capture-form" method="POST" action="">
    {% csrf_token %}
    <input type="hidden" name="image_data" id="image_data"/>

    <button type="button" id="capture-btn" disabled
      class="w-full bg-blue-500 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2 cursor-not-allowed opacity-60 transition-all"
      onclick="capturePhoto()">
      📷 Capture Photo
    </button>

    <button type="submit" id="submit-btn" class="hidden w-full mt-3 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2 transition-all">
      ✅ Proceed to Dashboard
    </button>

    <button type="button" id="retake-btn" class="hidden w-full mt-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 rounded-xl transition-all" onclick="retakePhoto()">
      🔄 Retake Photo
    </button>
  </form>

</div>

<script>
const video      = document.getElementById('cam');
const canvas     = document.getElementById('cnv');
const captureBtn = document.getElementById('capture-btn');
const submitBtn  = document.getElementById('submit-btn');
const retakeBtn  = document.getElementById('retake-btn');
const statusMsg  = document.getElementById('status-msg');
const videoBox   = document.getElementById('video-box');
const preview    = document.getElementById('captured-preview');
const previewImg = document.getElementById('captured-img');
const imageInput = document.getElementById('image_data');

(async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    captureBtn.disabled = false;
    captureBtn.classList.remove('cursor-not-allowed', 'opacity-60');
    captureBtn.classList.add('hover:bg-blue-700', 'cursor-pointer');
    videoBox.classList.add('ready');
    statusMsg.textContent = '✅ Camera ready — look directly at the camera.';
    statusMsg.className = 'text-center text-green-600 text-sm mb-4 flex items-center justify-center gap-2';
  } catch (e) {
    statusMsg.textContent = '❌ Camera access denied. Please allow camera and reload.';
    statusMsg.className = 'text-center text-red-500 text-sm mb-4 flex items-center justify-center gap-2';
  }
})();

function capturePhoto() {
  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  imageInput.value = dataUrl;

  // Show preview
  previewImg.src = dataUrl;
  preview.classList.remove('hidden');
  video.pause();

  captureBtn.classList.add('hidden');
  submitBtn.classList.remove('hidden');
  retakeBtn.classList.remove('hidden');
  statusMsg.textContent = '✅ Photo captured! Verify it looks good, then proceed.';
  statusMsg.className = 'text-center text-green-600 text-sm mb-4 flex items-center justify-center gap-2';
}

function retakePhoto() {
  imageInput.value = '';
  preview.classList.add('hidden');
  video.play();
  captureBtn.classList.remove('hidden');
  submitBtn.classList.add('hidden');
  retakeBtn.classList.add('hidden');
  statusMsg.textContent = '✅ Camera ready — look directly at the camera.';
  statusMsg.className = 'text-center text-green-600 text-sm mb-4 flex items-center justify-center gap-2';
}
</script>
</body>
</html>
