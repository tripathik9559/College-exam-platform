<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Teacher Login – BBDNIIT</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-gradient-to-br from-emerald-800 to-teal-900 flex items-center justify-center px-4 py-8">
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">👨‍🏫</div>
    <h1 class="text-white text-2xl font-bold">Teacher Login</h1>
    <p class="text-emerald-200 text-sm">BBDNIIT Examination Portal</p>
  </div>

  <div class="bg-white rounded-2xl shadow-2xl p-8">
    <form method="post" id="loginForm">{% csrf_token %}
      <div class="mb-4">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
        <input id="usernameInput" name="username" type="text" required
               class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-emerald-500 outline-none"/>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
        <input id="passwordInput" name="password" type="password" required
               class="block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-emerald-500 outline-none"/>
      </div>
      {% if form.errors %}<p class="text-red-600 text-sm mb-4">Invalid credentials.</p>{% endif %}
      <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2.5 rounded-xl transition">Login</button>
    </form>
    <p class="text-center mt-4 text-sm text-gray-500">No account? <a href="{% url 'teachersignup' %}" class="text-emerald-600 hover:underline">Register</a></p>
  </div>

  <!-- Demo Account Card -->
  <div class="mt-5 bg-white/10 backdrop-blur-sm border border-white/20 rounded-2xl p-4">
    <p class="text-white/60 text-xs font-semibold uppercase tracking-wider mb-3">🔑 Demo Account</p>
    <div class="flex items-center justify-between">
      <div>
        <p class="text-white font-semibold text-sm">👤 Demo Teacher</p>
        <p class="text-emerald-200 text-xs mt-0.5">Username: <span class="font-mono font-bold">teacher_demo</span></p>
        <p class="text-emerald-200 text-xs">Password: <span class="font-mono font-bold">teacher123</span></p>
      </div>
      <button onclick="fillDemo()"
              class="bg-white text-emerald-800 text-xs font-bold px-4 py-2 rounded-xl hover:bg-emerald-50 transition shadow">
        Fill &amp; Login
      </button>
    </div>
  </div>

</div>

<script>
function fillDemo() {
  document.getElementById('usernameInput').value = 'teacher_demo';
  document.getElementById('passwordInput').value = 'teacher123';
  document.getElementById('loginForm').submit();
}
</script>
</body></html>
